services:
  - type: web
    name: konglomerat-x9uh
    runtime: node
    plan: starter
    buildCommand: mkdir -p public && cp index.html public/index.html && cp app.js public/app.js && cp styles.css public/styles.css && cp favicon.svg public/favicon.svg && npm install
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: konglomerat-data
      mountPath: /data
      sizeGB: 5
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /data
      - key: EDITOR_PASSWORD
        sync: false
      - key: AUTH_SECRET
        generateValue: true